<style>
:root{--ink:#203a36;--muted:#596e69;--green:#176b53;--mint:#e7f1e8;--line:#d9e1d9;--paper:#f6f7f1;--white:#fff;--orange:#9b4a20;--red:#aa3434}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.7}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ad682e;outline-offset:4px}a{color:var(--green)}h1,h2,h3,p{margin:0}h1{font-size:42px;line-height:1.25;letter-spacing:-1.5px}h2{font-size:26px;line-height:1.4}h3{font-size:18px}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700}.wrap{max-width:1240px;margin:auto;padding:0 32px}header{border-bottom:1px solid var(--line);background:#ffffffc9}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:88px}.brand{display:flex;gap:12px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font:700 20px Georgia}.brand strong{font-size:19px;display:block;line-height:1.2}.brand small{color:var(--muted)}nav{display:flex;gap:6px;flex-wrap:wrap}.nav{border:0;background:none;color:var(--muted);padding:10px 16px;border-radius:8px;font-weight:600}.nav.active{background:var(--mint);color:var(--green)}main{min-height:calc(100vh - 180px);padding-top:38px;padding-bottom:50px!important}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12px}.foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;margin-bottom:30px}.hero h1{margin:16px 0}.hero p{max-width:500px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid var(--green);background:var(--green);color:white;padding:10px 20px;border-radius:9px;font-weight:600}.btn.secondary{background:white;color:var(--green);border-color:var(--line)}.btn.text{padding:5px 0;background:none;color:var(--green);border:0}.btn.danger{color:var(--red)}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:25px}.preview{background:#eaf0e5;border-color:#d3dfcd;position:relative;overflow:hidden}.preview:after{content:'Aa';position:absolute;right:4px;bottom:-62px;font:180px Georgia;color:#176b5309;pointer-events:none}.sentence{font:26px/1.85 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}.hero .sentence{margin:22px 0}.mark{padding:4px 2px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.mark.main{background:#edf0eb}.mark.clause{background:#dfebfa;color:#244e85}.mark.link{background:#ffdf9f;color:#734313;font-weight:bold}.mark.focus{background:#dfebfa;color:#244e85}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;margin:15px 0}.legend span:before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;background:#dfe4dc;margin-right:6px}.legend .clause:before{background:#a9c9f2}.legend .link:before{background:#e9b55c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0 34px}.stat{border-top:2px solid #c9d8cb;padding:14px 0}.stat strong{display:block;font-size:28px;line-height:1.4}.stat small{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.module{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:215px;transition:transform .15s,border-color .15s}.module:hover{border-color:#82a794;transform:translateY(-2px)}.module .bottom{margin-top:auto;display:flex;justify-content:space-between;width:100%;align-items:center}.tag{display:inline-block;border-radius:5px;padding:3px 8px;background:var(--mint);color:var(--green);font-size:11px;font-weight:700}.tag.blue{background:#eaf0fa;color:#365d91}.tag.gold{background:#faf0d9;color:#805c19}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{border:1px solid var(--line);background:white;border-radius:24px;padding:6px 15px;color:var(--muted)}.chip.active{background:var(--green);color:white;border-color:var(--green)}.lesson-layout{display:grid;grid-template-columns:245px 1fr;gap:24px}.side{padding:16px;height:fit-content}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:7px;color:var(--muted);margin:3px 0}.side button.active{background:var(--mint);color:var(--green);font-weight:700}.side .eyebrow{padding:10px}.lesson h2{margin:10px 0}.lesson .card{margin-top:18px}.lesson .sentence{margin:14px 0}.steps{padding-left:22px;margin:10px 0 0}.steps li{padding:4px 0}.callout{margin-top:18px;padding:16px 20px;border-left:3px solid #cb9146;background:#faf2e3;border-radius:0 8px 8px 0}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;margin:22px 0}label{display:block;font-size:13px;font-weight:600}select,input{background:white;border:1px solid #bdcec4;border-radius:8px;padding:12px;color:var(--ink);width:100%;margin-top:7px}.narrow{max-width:840px;margin:auto}.quiz-top{display:flex;justify-content:space-between;gap:14px;margin-bottom:14px}.progress{height:6px;background:#dce5dc;border-radius:9px;overflow:hidden;margin-bottom:26px}.progress i{display:block;height:100%;background:var(--green);transition:width .3s}.quiz .sentence{margin:18px 0;font-size:27px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.option{display:flex;text-align:left;gap:13px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}.option b{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#f0f3ec;flex-shrink:0}.option.selected{border-color:var(--green);background:#eef6ef}.option.correct{border-color:var(--green);background:#e9f5e9}.option.wrong{border-color:#c47474;background:#fff0ed}.answer-input{font-family:Georgia,"Microsoft YaHei",serif;font-size:20px}.feedback{margin-top:22px;padding:20px;border-radius:12px;background:#edf6ec;border:1px solid #bfd5bd}.feedback.error{background:#fff3ee;border-color:#e5c5b8}.feedback p{margin-top:8px}.hint{padding:12px 16px;background:#fff7e5;border-radius:8px;margin-top:12px}.quiz-controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px}.notice{color:var(--orange);font-size:13px;margin-top:10px}.empty{text-align:center;padding:45px 20px}.score{font-size:65px;font-weight:700;line-height:1.4;color:var(--green)}.review-item{margin:16px 0}.review-item .sentence{font-size:21px;margin:12px 0}.topic-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}.result-head{text-align:center;padding:25px}.print-only{display:none}details{margin-top:12px}summary{cursor:pointer;color:var(--green)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}@media(max-width:900px){.hero{grid-template-columns:1fr;gap:22px}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:35px}.lesson-layout{grid-template-columns:1fr}.side{display:none}header .wrap{align-items:flex-start;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:12px}.nav{padding:8px 12px}}@media(max-width:560px){.wrap{padding:0 18px}main{padding-top:24px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:4px 18px}.card{padding:20px}.options,.form-grid{grid-template-columns:1fr}.sentence,.quiz .sentence{font-size:23px}.section-head{align-items:flex-start}.hero h1{font-size:32px}.quiz-controls{flex-wrap:wrap}.quiz-top{font-size:12px}nav{gap:0}.nav{font-size:13px}.score{font-size:52px}}@media print{header,footer,.actions,.filters,.quiz-controls,button,.side{display:none!important}.lesson-layout{display:block}body{background:white}.card{break-inside:avoid}.print-only{display:block}}
</style>

<body>
<header><div class="wrap"><div class="brand"><span class="logo" aria-hidden="true">g.</span><div><strong>Grammar Lab</strong><small>高中英语 · 语法实验室</small></div></div><nav aria-label="主导航"><button class="nav" data-view="home">学习地图</button><button class="nav" data-view="learn">语法讲解</button><button class="nav" data-view="practice">专项练习</button><button class="nav" data-view="wrong">错题本 <span id="wrong-count">0</span></button></nav></div></header>
<main class="wrap" id="app" tabindex="-1"><section class="card"><h2>页面内容尚未加载</h2><p>如果你打开的是 assets 文件夹中的 template.html，这是生成用的模板。请返回 english-grammar-lab 文件夹，打开 index.html。</p><p>分享给学生时，只需发送生成后的 index.html 文件本身；不要只发送本地文件路径。</p><noscript><p>当前浏览器未启用 JavaScript，请允许此页面运行 JavaScript 后重新打开，才能使用练习与批改功能。</p></noscript><p class="small muted">若你已经打开 index.html 且仍看到此提示，请确认文件完整，并尝试在 Chrome 或 Edge 中打开。</p></section></main>
<footer><div class="wrap foot"><span>理解结构，让语法有迹可循。</span><span>原创教学题 · 无需联网 · 学习记录仅保存在本浏览器</span></div></footer>
<script id="course-data" type="application/json">__COURSE_JSON__</script>
<script>
'use strict';
const COURSE=JSON.parse(document.getElementById('course-data').textContent);
const Q=new Map(COURSE.questions.map(q=>[q.id,q])), M=new Map(COURSE.modules.map(m=>[m.id,m]));
const STORE='grammar-lab:v1', app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const levels=['','基础','进阶','挑战'], types={choice:'单项选择',fill:'语法填空',repair:'受控改错'};
let storageOK=true, state=readState(), currentView='home', currentModule=COURSE.modules[2]?.id||COURSE.modules[0].id, group='全部', quiz=null;
function blankState(){return {version:COURSE.version,wrong:{},stats:{},history:[]};}
function readState(){try{const raw=localStorage.getItem(STORE);if(!raw)return blankState();const d=JSON.parse(raw),s=blankState();if(!d||typeof d!=='object'||d.version!==COURSE.version)return s;for(const [id,w] of Object.entries(d.wrong||{}))if(Q.has(id)&&w&&typeof w.answer==='string')s.wrong[id]={answer:w.answer,date:typeof w.date==='string'?w.date:''};for(const [id,v] of Object.entries(d.stats||{}))if(M.has(id)&&v&&Number.isSafeInteger(v.total)&&Number.isSafeInteger(v.correct)&&v.total>=v.correct&&v.correct>=0)s.stats[id]={total:v.total,correct:v.correct};s.history=Array.isArray(d.history)?d.history.filter(h=>h&&Number.isSafeInteger(h.total)&&h.total>0&&Number.isSafeInteger(h.correct)&&h.correct>=0&&h.correct<=h.total&&typeof h.date==='string').slice(-30):[];return s;}catch(e){storageOK=false;return blankState();}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){storageOK=false;}updateCount();}
function updateCount(){document.getElementById('wrong-count').textContent=Object.keys(state.wrong).length;}
function notice(){return storageOK?'':'<p class="notice" role="status">当前浏览器无法读取或保存学习记录，本次仍可正常练习；请及时导出记录。</p>';}
function button(text,action,cls='btn',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;}
function tag(m){return `<span class="tag ${m.group==='基础'?'gold':m.group==='名词性从句'?'blue':''}">${esc(m.group)}</span>`;}
function segments(m){return m.example.map(s=>`<span class="mark ${s.role}">${esc(s.text)}</span>`).join('');}
function legend(){return '<div class="legend"><span>主句 / 主干</span><span class="clause">从句 / 关注成分</span><span class="link">连接词</span></div>';}
function totals(){return Object.values(state.stats).reduce((a,v)=>({total:a.total+v.total,correct:a.correct+v.correct}),{total:0,correct:0});}
function pct(c,t){return t?Math.round(c/t*100)+'%':'—';}
function statsMarkup(){const t=totals();return `<div class="stats"><div class="stat"><strong>${COURSE.modules.length}</strong><small>学习单元</small></div><div class="stat"><strong>${t.total}</strong><small>累计作答次数</small></div><div class="stat"><strong>${pct(t.correct,t.total)}</strong><small>练习正确率（含重练）</small></div><div class="stat"><strong>${Object.keys(state.wrong).length}</strong><small>待复习错题</small></div></div>`;}
function go(view){currentView=view;document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(view==='home')home();if(view==='learn')learn();if(view==='practice'){quiz?(quiz.finished?result():renderQuestion()):setup();}if(view==='wrong')wrong();updateCount();app.focus();window.scrollTo(0,0);}
function home(){const m=M.get(currentModule);app.innerHTML=`<section class="hero"><div><div class="eyebrow">LESS WORDS TO MEMORIZE. MORE STRUCTURE TO SEE.</div><h1>读懂一句话，<br>从看见它的结构开始。</h1><p class="muted">从词性与句型出发，走进三大从句。拆开例句、动手练习，在每一次反馈中找到判断的依据。</p><div class="actions">${button('开始学习 ↗','lesson','btn',`data-id="${esc(currentModule)}"`)}${button('来一组综合练习','new','btn secondary')}</div></div><div class="card preview"><span class="eyebrow">SENTENCE EXPLORER / 例句拆解</span><div class="sentence">${segments(m)}</div>${legend()}<p class="small">${esc(m.analysis)}</p></div></section>${notice()}${statsMarkup()}<div class="section-head"><div><span class="eyebrow">YOUR LEARNING MAP</span><h2>一张地图，理清语法</h2></div><span class="muted small">${COURSE.questions.length} 道原创练习 · 从句优先</span></div><div class="filters">${['全部','基础','定语从句','名词性从句','状语从句'].map(g=>button(g,'filter','chip'+(g===group?' active':''),`data-group="${g}" aria-pressed="${g===group}"`)).join('')}</div><section class="grid" aria-label="学习单元">${COURSE.modules.filter(m=>group==='全部'||m.group===group).map(m=>{const s=state.stats[m.id];return `<article class="card module">${tag(m)}<h3>${esc(m.title)}</h3><p class="muted small">${esc(m.summary)}</p><div class="bottom"><small class="muted">${s?`已答 ${s.total} 次 · 正确率 ${pct(s.correct,s.total)}`:'尚未练习'}</small>${button('学习 →','lesson','btn text',`data-id="${esc(m.id)}"`)}</div></article>`;}).join('')}</section>`;}
function guideMarkup(m){return !m.guide?'':'<div class="card"><h3>随手查 · '+esc(m.group==='基础'&&m.id==='parts'?'常见词性':'基本句型')+'</h3>'+m.guide.map(g=>'<div style="padding:14px 0;border-bottom:1px solid var(--line)"><strong>'+esc(g.term)+'</strong><p class="small muted">'+esc(g.detail)+'</p><p style="font-family:Georgia,serif;margin-top:5px" lang="en">'+esc(g.example)+'</p></div>').join('')+'</div>';}
function learn(){const m=M.get(currentModule);app.innerHTML=`<div class="lesson-layout"><aside class="card side" aria-label="单元目录"><div class="eyebrow">GRAMMAR NOTES</div>${COURSE.modules.map(v=>button(esc(v.title),'lesson',v.id===m.id?'active':'',`data-id="${esc(v.id)}"`)).join('')}</aside><section class="lesson"><div class="section-head"><div>${tag(m)}<h2>${esc(m.title)}</h2><p class="muted">${esc(m.summary)}</p></div>${button('练习本单元 ↗','topic','btn',`data-id="${esc(m.id)}"`)}</div><label class="small">切换单元<select id="lesson-select">${COURSE.modules.map(v=>`<option value="${esc(v.id)}" ${v.id===m.id?'selected':''}>${esc(v.group)} · ${esc(v.title)}</option>`).join('')}</select></label><div class="card"><span class="eyebrow">01 / 核心规则</span><p style="margin-top:12px">${esc(m.rule)}</p></div>${guideMarkup(m)}<div class="card"><span class="eyebrow">02 / 拆开例句</span><div class="sentence" lang="en">${segments(m)}</div>${legend()}<p class="muted">${esc(m.translation)}</p><p style="margin-top:12px">${esc(m.analysis)}</p></div><div class="card"><span class="eyebrow">03 / 如何判断</span><ol class="steps">${m.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="callout"><strong>易错提醒</strong><p>${esc(m.pitfall)}</p></div></div><div class="actions">${button('讲解看懂了，做几道题 →','topic','btn',`data-id="${esc(m.id)}"`)}</div></section></div>`;}
function setup(topic='all'){app.innerHTML=`<section class="narrow"><span class="eyebrow">PRACTICE / 从理解到运用</span><h1 style="margin:12px 0">给自己一组小练习。</h1><p class="muted">先识别结构，再选择答案。每题提交后立即批改，并解释判断依据。</p>${notice()}<div class="card" style="margin-top:26px"><h3>设置本次练习</h3><div class="form-grid"><label>学习专题<select id="topic"><option value="all">全部专题 · 综合练习</option>${COURSE.modules.map(m=>`<option value="${esc(m.id)}" ${m.id===topic?'selected':''}>${esc(m.group)} · ${esc(m.title)}</option>`).join('')}</select></label><label>难度<select id="level"><option value="0">全部难度</option><option value="1">基础</option><option value="2">进阶</option><option value="3">挑战</option></select></label><label>题数<select id="count"><option value="5">5 道</option><option value="10" selected>10 道</option><option value="20">20 道</option><option value="9999">所有符合题目</option></select></label></div><p class="muted small" id="available"></p><div class="actions">${button('开始练习 →','start')}</div><div class="callout small">单选、填空与受控改错自动批改。填空支持题库列出的合理变体；改错请按题干限定范围作答。题库不是自由写作评分器。</div></div></section>`;availability();}
function pool(){const topic=document.getElementById('topic').value,level=+document.getElementById('level').value;return COURSE.questions.filter(q=>(topic==='all'||q.module===topic)&&(!level||q.level===level));}
function availability(){const n=pool().length,c=+document.getElementById('count').value;document.getElementById('available').textContent=`符合条件 ${n} 道，本次将练习 ${Math.min(n,c)} 道。题目不足时使用全部符合题目。`;document.querySelector('[data-action="start"]').disabled=!n;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(ids,review=false){const items=shuffle(ids).filter(id=>Q.has(id));if(!items.length)return;quiz={items,index:0,results:[],selected:'',submitted:false,hint:false,review,finished:false};go('practice');}
function normalize(s,type){let v=String(s).trim().replace(/\s+/g,' ').toLowerCase();return type==='repair'?v.replace(/[.?!。？！]+$/u,'').trim():v;}
function grade(q,s){return q.answers.some(a=>normalize(a,q.type)===normalize(s,q.type));}
function renderQuestion(){const q=Q.get(quiz.items[quiz.index]),m=M.get(q.module);app.innerHTML=`<section class="narrow quiz"><div class="quiz-top"><span>${quiz.review?'错题重练':'专项练习'} · 第 ${quiz.index+1} / ${quiz.items.length} 题</span><span class="muted">${esc(m.title)} · ${levels[q.level]} · ${types[q.type]}</span></div><div class="progress" role="progressbar" aria-label="本组完成进度" aria-valuemin="0" aria-valuemax="${quiz.items.length}" aria-valuenow="${quiz.index}"><i style="width:${quiz.index/quiz.items.length*100}%"></i></div><div class="card"><h2 style="font-size:21px">${esc(q.prompt)}</h2><div class="sentence" lang="en">${esc(q.sentence)}</div>${q.type==='choice'?`<div class="options" role="group" aria-label="答案选项">${q.options.map((o,i)=>`<button class="option ${quiz.selected===o?'selected':''} ${quiz.submitted?(q.answers.includes(o)?'correct':quiz.selected===o?'wrong':''):''}" data-action="choose" data-index="${i}" aria-pressed="${quiz.selected===o}" ${quiz.submitted?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}</div>`:`<label for="answer">${q.type==='repair'?'输入改正后的完整句子':'输入答案'}</label><input id="answer" class="answer-input" autocomplete="off" spellcheck="false" value="${esc(quiz.selected)}" ${quiz.submitted?'disabled':''}><p class="small muted">${q.type==='repair'?'忽略大小写、多余空格和句末标点；保留内部标点与完整词序。':'忽略大小写、首尾空格和多余空白。'} 按 Enter 提交。</p>`}<p id="answer-error" class="notice" role="status"></p>${quiz.hint?`<div class="hint small">思路提示：${esc(q.hint)}</div>`:''}${quiz.submitted?feedback(q):''}<div class="quiz-controls">${button(quiz.hint?'收起提示':'给我一点提示','hint','btn text')}${quiz.submitted?button(quiz.index+1===quiz.items.length?'查看本组结果 →':'下一题 →','next'):button('提交答案','submit')}</div></div><p class="small muted" style="margin-top:16px">${quiz.review?'答对后该题会从错题本移除。':'答错会自动加入错题本；答对后从错题本移除。'} 本次进度在切换页签时保留，刷新后需重新开始。</p></section>`;}
function feedback(q){const r=quiz.results[quiz.index];return `<div class="feedback ${r.ok?'':'error'}" role="status"><strong>${r.ok?'✓ 回答正确':'✕ 还差一步，再看结构'}</strong><p>参考答案：<strong>${q.answers.map(esc).join(' / ')}</strong></p><p>${esc(q.explanation)}</p>${button('回看本单元讲解 ↗','lesson','btn text',`data-id="${esc(q.module)}"`)}</div>`;}
function submit(){if(!quiz||quiz.submitted||quiz.finished)return;const q=Q.get(quiz.items[quiz.index]);if(q.type!=='choice')quiz.selected=document.getElementById('answer').value;const answer=quiz.selected.trim();if(!answer){document.getElementById('answer-error').textContent='请先选择或输入答案，再提交。';return;}const ok=grade(q,answer),date=new Date().toISOString();quiz.results.push({id:q.id,answer,ok});quiz.submitted=true;const s=state.stats[q.module]||(state.stats[q.module]={total:0,correct:0});s.total++;if(ok){s.correct++;delete state.wrong[q.id];}else state.wrong[q.id]={answer,date};save();renderQuestion();document.querySelector('[data-action="next"]').focus();}
function next(){if(!quiz||!quiz.submitted||quiz.finished)return;if(quiz.index+1===quiz.items.length){quiz.finished=true;state.history.push({date:new Date().toISOString(),correct:quiz.results.filter(r=>r.ok).length,total:quiz.results.length,review:quiz.review});state.history=state.history.slice(-30);save();result();return;}quiz.index++;quiz.selected='';quiz.submitted=false;quiz.hint=false;renderQuestion();app.focus();window.scrollTo(0,0);}
function result(){const correct=quiz.results.filter(r=>r.ok).length,wrongItems=quiz.results.filter(r=>!r.ok),by={};for(const r of quiz.results){const id=Q.get(r.id).module;by[id]??={correct:0,total:0};by[id].total++;if(r.ok)by[id].correct++;}app.innerHTML=`<section class="narrow"><div class="result-head"><span class="eyebrow">SESSION COMPLETE / 本组完成</span><div class="score">${pct(correct,quiz.results.length)}</div><h2>${correct} / ${quiz.results.length} 道答对</h2><p class="muted">${wrongItems.length?'把错误还原成结构，就是下一次进步的起点。':'这一组完成得很好，可以尝试其他专题或更高难度。'}</p><div class="actions" style="justify-content:center">${button('再来一组','new')}${wrongItems.length?button('重练本组错题','retry-session','btn secondary'):''}${button('返回学习地图','home','btn secondary')}</div></div><div class="card"><h3>本组专题表现</h3>${Object.entries(by).map(([id,v])=>`<div class="topic-row"><span>${esc(M.get(id).title)}</span><strong>${v.correct} / ${v.total}</strong></div>`).join('')}</div>${wrongItems.length?'<h3 style="margin-top:24px">错题与解析</h3>'+wrongItems.map(r=>reviewCard(Q.get(r.id),r.answer)).join(''):''}${notice()}</section>`;}
function reviewCard(q,answer){return `<article class="card review-item"><div class="small muted">${esc(M.get(q.module).title)} · ${levels[q.level]} · ${types[q.type]}</div><h3>${esc(q.prompt)}</h3><p class="sentence" lang="en">${esc(q.sentence)}</p><p class="small">你的答案：${esc(answer)}</p><p class="small">参考答案：<strong>${q.answers.map(esc).join(' / ')}</strong></p><details><summary>查看结构与解析</summary><p>${esc(q.explanation)}</p>${button('回看讲解 →','lesson','btn text',`data-id="${esc(q.module)}"`)}</details></article>`;}
function wrong(){const ids=Object.keys(state.wrong).filter(id=>Q.has(id));app.innerHTML=`<section class="narrow"><div class="section-head"><div><span class="eyebrow">REVIEW / 把错题变成线索</span><h1 style="font-size:34px;margin-top:10px">我的错题本</h1></div><span class="tag">${ids.length} 道待复习</span></div><p class="muted">记录最近一次错误答案。重练答对后自动移除，学习统计会保留。</p><div class="actions">${ids.length?button('重练全部错题 →','retry-wrong'):''}${button('导出学习记录','export','btn secondary')}${button('清空本地学习记录','clear','btn text danger')}</div>${notice()}${ids.length?ids.map(id=>reviewCard(Q.get(id),state.wrong[id].answer)).join(''):'<div class="card empty" style="margin-top:24px"><h2>暂时没有待复习错题</h2><p class="muted">开始一组练习，让每个知识点都得到检验。</p><div class="actions" style="justify-content:center">'+button('开始练习','new')+'</div></div>'}<details><summary>记录保存在何处？</summary><p class="small muted">仅保存在此设备、此浏览器中，不会上传。隐私模式、清理浏览器数据或改变网页路径可能使记录不可用。导出为 JSON，便于留档；本版本不提供导入和账号同步。</p></details></section>`;}
function exportState(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}));a.href=url;a.download='grammar-lab-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){go(nav.dataset.view);return;}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='home')go('home');if(a==='lesson'){currentModule=b.dataset.id;go('learn');}if(a==='filter'){group=b.dataset.group;home();}if(a==='topic'){quiz=null;go('practice');setup(b.dataset.id);}if(a==='new'){quiz=null;go('practice');}if(a==='start')start(shuffle(pool()).slice(0,+document.getElementById('count').value).map(q=>q.id));if(a==='choose'&&!quiz.submitted){quiz.selected=Q.get(quiz.items[quiz.index]).options[+b.dataset.index];renderQuestion();document.querySelectorAll('.option')[+b.dataset.index].focus();}if(a==='hint'){const input=document.getElementById('answer');if(input)quiz.selected=input.value;quiz.hint=!quiz.hint;renderQuestion();document.querySelector('[data-action="hint"]').focus();}if(a==='submit')submit();if(a==='next')next();if(a==='retry-wrong')start(Object.keys(state.wrong),true);if(a==='retry-session')start(quiz.results.filter(r=>!r.ok).map(r=>r.id),true);if(a==='export')exportState();if(a==='clear'&&confirm('清空本浏览器中的错题、统计和练习记录？此操作无法撤销。')){state=blankState();quiz=null;save();wrong();}});
document.addEventListener('change',e=>{if(e.target.id==='lesson-select'){currentModule=e.target.value;go('learn');}if(['topic','level','count'].includes(e.target.id))availability();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();submit();}});
document.addEventListener('input',e=>{if(e.target.id==='answer'&&quiz&&!quiz.submitted)quiz.selected=e.target.value;});
go('home');
</script>
</body></html>
